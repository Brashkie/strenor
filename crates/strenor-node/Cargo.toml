[package]
name = "strenor-node"
description = "NAPI bindings for Strenor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
strenor-store = { path = "../strenor-store" }

[build-dependencies]
napi-build = "2"
